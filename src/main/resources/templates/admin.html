<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store Management</title><link rel="stylesheet" href="/style.css"></head><body><header><a href="/">WEB3G2 SHOP</a><nav><a href="/">Customer storefront</a></nav></header><main><h1>Store management</h1><p class="notice">Educational demo: admin access is not authenticated. Do not expose this application publicly.</p><section class="panel"><h2>Add product</h2><form action="/admin/products" method="post" class="inline"><input name="name" placeholder="Product name" required><input name="category" placeholder="Category" required><input type="number" step="0.01" min="0.01" name="price" placeholder="Price" required><input type="number" min="0" name="stock" placeholder="Stock" required><button>Add product</button></form></section><section class="panel"><h2>Products (edit / delete)</h2><div th:each="p:${products}" class="admin-row"><form th:action="@{'/admin/products/'+${p.id}}" method="post" class="inline"><input name="name" th:value="${p.name}" required><input name="category" th:value="${p.category}" required><input type="number" step="0.01" min="0.01" name="price" th:value="${p.price}" required><input type="number" min="0" name="stock" th:value="${p.stock}" required><button>Save</button></form><form th:action="@{'/admin/products/'+${p.id}+'/delete'}" method="post"><button class="danger">Delete</button></form></div></section><section class="panel"><h2>Orders</h2><div th:each="o:${orders}" class="admin-row"><div><strong th:text="'Order #'+${o.id}"></strong><p th:text="${o.customerName}+' · '+${o.email}+' · LKR '+${o.total}"></p><p th:text="${o.address}"></p></div><form th:action="@{'/admin/orders/'+${o.id}+'/status'}" method="post" class="inline"><select name="status"><option th:each="s : ${ {'PLACED','PROCESSING','SHIPPED','DELIVERED','CANCELLED'} }" th:value="${s}" th:text="${s}" th:selected="${s==o.status}"></option></select><button>Update status</button></form></div></section></main></body></html>
