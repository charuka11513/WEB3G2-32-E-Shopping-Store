<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | WEB3G2 Market</title><link rel="stylesheet" href="/style.css"></head><body><header class="site-header"><a class="brand" href="/">WEB3G2<span class="accent">MARKET</span></a><nav><a href="/cart">← Back to cart</a></nav></header><main class="narrow"><div class="page-heading"><span class="eyebrow dark">ALMOST THERE</span><h1>Checkout</h1><p>One order for all items in your cart.</p></div><p class="notice error" th:if="${error}" th:text="${error}"></p><div class="cart-layout"><section class="panel checkout-panel"><h2>Delivery details</h2><form action="/cart/checkout" method="post" class="checkout-form"><label>Full name<input name="customerName" maxlength="100" autocomplete="name" required placeholder="Your full name"></label><label>Email address<input name="email" type="email" maxlength="150" autocomplete="email" required placeholder="name@example.com"></label><label>Delivery address<textarea name="address" maxlength="255" rows="4" autocomplete="street-address" required placeholder="House number, street, city"></textarea></label><p class="muted">This is a demonstration order. No payment will be collected.</p><button class="checkout-btn">Place order →</button></form></section><aside class="summary"><span class="eyebrow dark">ORDER SUMMARY</span><h2>Your items</h2><div class="summary-line" th:each="r:${rows}"><span th:text="${r.product.name}+' × '+${r.quantity}"></span><strong th:text="'LKR '+${r.subtotal}"></strong></div><div class="summary-total"><span>Total</span><strong th:text="'LKR '+${total}"></strong></div></aside></div></main><footer>WEB3G2 Market · Educational prototype</footer></body></html>
